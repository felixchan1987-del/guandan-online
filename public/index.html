<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>掼蛋在线</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 大厅 -->
  <section id="lobby" class="hidden">
    <div class="lobby-card">
      <h1>掼蛋在线</h1>
      <p class="sub">4 人对战 · 不限人数观战</p>
      <label>昵称 <input id="nameInput" maxlength="12" placeholder="输入昵称"></label>
      <button id="createBtn" class="primary">创建房间</button>
      <div class="join-row">
        <input id="codeInput" maxlength="8" placeholder="房间号">
        <button id="joinBtn">加入</button>
      </div>
    </div>
  </section>

  <!-- 房间 -->
  <section id="room" class="hidden">
    <header class="topbar">
      <div>房间 <b id="roomCode"></b> <button id="copyBtn" class="small">复制链接</button></div>
      <div id="levelInfo"></div>
      <div><span id="identity"></span> <button id="renameBtn" class="small">改名</button> <button id="chatBtn" class="small">聊天</button></div>
    </header>

    <main class="table">
      <div class="seat top" data-pos="2"></div>
      <div class="seat left" data-pos="3"></div>
      <div class="seat right" data-pos="1"></div>
      <div class="center">
        <div id="status"></div>
        <div id="tributeInfo"></div>
        <div id="centerActions"></div>
      </div>
      <div class="seat bottom" data-pos="0"></div>
    </main>

    <div id="handArea" class="hidden">
      <div id="options"></div>
      <div class="actions">
        <button id="autoBtn">托管</button>
        <button id="passBtn">不出</button>
        <button id="hintBtn">提示</button>
        <button id="playBtn" class="primary">出牌</button>
      </div>
      <div id="hand"></div>
      <div class="tools">
        <button id="groupBtn" class="small" title="把选中的牌理成一列，放到最左边">理牌</button>
        <button id="arrangeBtn" class="small" title="恢复自动排列：炸弹、同花顺在左">一键理牌</button>
        <button id="sfBtn" class="small">同花顺</button>
        <button id="clearBtn" class="small">重选</button>
        <span class="rotate-tip">📱 横屏打牌更清楚</span>
      </div>
    </div>

    <footer id="spectators"></footer>
  </section>

  <div id="chatPanel" class="hidden">
    <div id="chatLog"></div>
    <div class="quick-row">
      <button class="quick small">快点吧</button>
      <button class="quick small">好牌！</button>
      <button class="quick small">配合得不错</button>
      <button class="quick small">再来一局</button>
    </div>
    <form id="chatForm">
      <input id="chatInput" maxlength="100" placeholder="说点什么…" autocomplete="off">
      <button class="primary">发送</button>
    </form>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
