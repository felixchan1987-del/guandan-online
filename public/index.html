<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>掼蛋在线</title>
  <meta name="theme-color" content="#1b4c9c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="掼蛋在线">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 大厅 -->
  <section id="lobby" class="hidden">
    <div class="lobby-card">
      <h1>掼蛋在线</h1>
      <p class="sub">4 人对战 · 不限人数观战</p>
      <div class="profile-row">
        <button id="lobbyAvatarBtn" class="avatar-pick" title="点击上传头像"><span id="lobbyAvatar"></span><span class="pick-tip">上传头像</span></button>
        <label>昵称 <input id="nameInput" maxlength="12" placeholder="输入昵称"></label>
      </div>
      <button id="createBtn" class="primary">创建房间</button>
      <button id="practiceBtn">🤖 和机器人练习</button>
      <button id="lobbyLoadBtn">读取存档继续</button>
      <div class="join-row">
        <input id="codeInput" maxlength="8" placeholder="房间号">
        <button id="joinBtn">加入</button>
      </div>
      <div id="recentRooms" class="recent"></div>
    </div>
  </section>

  <!-- 房间 -->
  <section id="room" class="hidden">
    <header class="topbar">
      <button id="backBtn" class="icon-btn" title="返回大厅">‹</button>
      <div class="room-title">房间 <b id="roomCode"></b></div>
      <button id="copyBtn" class="chip">⧉ 复制链接</button>
      <span id="roleChip" class="chip ghost hidden">观战中</span>
      <div class="spacer"></div>
      <button id="counterBtn" class="icon-btn" title="记牌器">🃏</button>
      <button id="chatBtn" class="icon-btn" title="聊天">💬<span id="chatBadge" class="badge hidden"></span></button>
      <button id="moreBtn" class="icon-btn" title="更多">⋯</button>
    </header>

    <div class="scoreboard">
      <div class="sb-team t0"><span>蓝队</span><b id="lv0">2</b><small id="af0"></small></div>
      <div class="sb-mid"><span id="roundNo">未开始</span><b>打 <em id="lvCur">2</em></b></div>
      <div class="sb-team t1"><span>红队</span><b id="lv1">2</b><small id="af1"></small></div>
    </div>

    <div id="counter" class="counter hidden"></div>

    <main class="table">
      <div class="seat top" data-pos="2"></div>
      <div class="seat left" data-pos="3"></div>
      <div class="seat right" data-pos="1"></div>
      <div class="center">
        <div id="status"></div>
        <div id="tributeInfo"></div>
        <div id="centerActions"></div>
      </div>
      <div class="seat bottom" data-pos="0"></div>
    </main>

    <div id="handArea" class="hidden">
      <!-- 只在轮到自己时浮现在手牌上方，不占布局空间 -->
      <div class="actions">
        <div id="options"></div>
        <div class="act-row">
          <button id="passBtn" class="big-btn"><span class="ic">⊘</span><span class="lbl">不要</span></button>
          <button id="hintBtn" class="big-btn"><span class="ic">💡</span><span class="lbl">提示</span></button>
          <button id="playBtn" class="primary big-btn"><span class="ic">♠</span><span class="lbl">出牌</span></button>
        </div>
        <button id="cancelAutoBtn" class="big-btn auto-on-btn">🤖 托管中 · 点此取消</button>
      </div>
      <div id="hand" class="hand-cols"></div>
      <div class="tools">
        <button id="groupBtn" class="small" title="把选中的牌理成一列，放到最左边">理牌</button>
        <button id="arrangeBtn" class="small">一键理牌</button>
        <button id="sfBtn" class="small">同花顺</button>
        <button id="clearBtn" class="small">重选</button>
        <button id="autoBtn" class="small"><span class="lbl">托管</span></button>
      </div>
    </div>

    <footer id="spectators"></footer>
    <button id="godFab" class="god-fab hidden"><span class="eye"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5C6.5 5 2.7 9.1 1.5 12c1.2 2.9 5 7 10.5 7s9.3-4.1 10.5-7C21.3 9.1 17.5 5 12 5zm0 11.2a4.2 4.2 0 1 1 0-8.4 4.2 4.2 0 0 1 0 8.4zm0-2.3a1.9 1.9 0 1 0 0-3.8 1.9 1.9 0 0 0 0 3.8z"/></svg></span>上帝视角</button>
  </section>

  <!-- 聊天 -->
  <div id="chatPanel" class="hidden">
    <div id="chatLog"></div>
    <div class="quick-row">
      <button class="quick small">快点吧</button>
      <button class="quick small">好牌！</button>
      <button class="quick small">配合得不错</button>
      <button class="quick small">再来一局</button>
    </div>
    <form id="chatForm">
      <input id="chatInput" maxlength="100" placeholder="说点什么…" autocomplete="off">
      <button class="primary">发送</button>
    </form>
  </div>

  <!-- 更多菜单 -->
  <div id="moreMenu" class="modal hidden">
    <div class="sheet">
      <div class="sheet-head"><span id="moreAvatar"></span><div><b id="moreName"></b><small id="moreRole"></small></div></div>
      <button class="menu-item" data-act="rename"><span class="mi-icon">✏️</span><span class="mi-text"><b>改名</b></span><span class="chev">›</span></button>
      <button class="menu-item" data-act="avatar"><span class="mi-icon">🖼️</span><span class="mi-text"><b>更换头像</b></span><span class="chev">›</span></button>
      <button class="menu-item" data-act="pause"><span class="mi-icon">⏸</span><span class="mi-text"><b>暂停对局</b><small>暂停后可换人、加减机器人</small></span><span class="chev">›</span></button>
      <button class="menu-item" data-act="save"><span class="mi-icon">💾</span><span class="mi-text"><b>存档</b><small>保存当前对局，下次继续</small></span><span class="chev">›</span></button>
      <button class="menu-item" data-act="load"><span class="mi-icon">📂</span><span class="mi-text"><b>读取存档</b></span><span class="chev">›</span></button>
      <button class="menu-item" data-act="settings"><span class="mi-icon">⚙️</span><span class="mi-text"><b>设置</b><small>牌面大小、桌面颜色、音效、出牌确认</small></span><span class="chev">›</span></button>
      <button class="menu-item" data-act="lobby"><span class="mi-icon">🏠</span><span class="mi-text"><b>返回大厅</b></span><span class="chev">›</span></button>
      <button class="cancel">取消</button>
    </div>
  </div>

  <!-- 上帝视角菜单 -->
  <div id="godMenu" class="modal hidden">
    <div class="sheet">
      <div class="sheet-head"><span class="eye big"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5C6.5 5 2.7 9.1 1.5 12c1.2 2.9 5 7 10.5 7s9.3-4.1 10.5-7C21.3 9.1 17.5 5 12 5zm0 11.2a4.2 4.2 0 1 1 0-8.4 4.2 4.2 0 0 1 0 8.4zm0-2.3a1.9 1.9 0 1 0 0-3.8 1.9 1.9 0 0 0 0 3.8z"/></svg></span><b class="title">上帝视角</b></div>
      <p class="muted">可以查看所有玩家的手牌，或单独查看某个玩家的手牌。</p>
      <button class="menu-item" data-god="all"><span class="mi-icon">👥</span><span class="mi-text"><b>查看所有玩家手牌</b><small>显示每个玩家的手牌（仅自己可见）</small></span><span class="chev">›</span></button>
      <button class="menu-item" data-god="one"><span class="mi-icon">👤</span><span class="mi-text"><b>查看指定玩家手牌</b><small>选择玩家单独查看其手牌</small></span><span class="chev">›</span></button>
      <button class="menu-item plain" data-god="off"><span class="mi-icon x">✕</span><span class="mi-text"><b>关闭上帝视角</b></span></button>
      <button class="cancel">取消</button>
    </div>
  </div>

  <!-- 上帝视角面板 -->
  <div id="godPanel" class="god-panel hidden">
    <div class="gp-head"><span class="eye"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5C6.5 5 2.7 9.1 1.5 12c1.2 2.9 5 7 10.5 7s9.3-4.1 10.5-7C21.3 9.1 17.5 5 12 5zm0 11.2a4.2 4.2 0 1 1 0-8.4 4.2 4.2 0 0 1 0 8.4zm0-2.3a1.9 1.9 0 1 0 0-3.8 1.9 1.9 0 0 0 0 3.8z"/></svg></span><b>上帝视角</b><span class="dot">·</span><span id="gpMode">所有玩家</span><button id="gpClose" class="icon-btn" title="关闭上帝视角">✕</button></div>
    <div id="gpAll" class="gp-all">
      <div class="gp-box" data-pos="2"></div>
      <div class="gp-box" data-pos="3"></div>
      <div class="gp-mid"><b id="gpMidType">—</b><small id="gpMidSub">当前出牌</small></div>
      <div class="gp-box" data-pos="1"></div>
      <div class="gp-box" data-pos="0"></div>
    </div>
    <div id="gpOne" class="gp-one hidden">
      <div class="gp-card" id="gpCard">
        <div class="gp-card-head" id="gpCardHead"></div>
        <div class="gp-card-body">
          <button class="nav prev" id="gpPrev">‹</button>
          <div id="gpHand" class="hand-cols"></div>
          <button class="nav next" id="gpNext">›</button>
        </div>
        <div class="dots" id="gpDots"></div>
      </div>
      <div class="gp-pick" id="gpPick"></div>
      <button id="gpBack" class="wide">返回全部玩家</button>
    </div>
    <div class="gp-foot">上帝视角仅观战者可见，玩家看不到其他人的手牌</div>
  </div>

  <!-- 退出上帝视角提示 -->
  <div id="godExit" class="modal hidden">
    <div class="dialog">
      <div class="dialog-row"><span class="eye big"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5C6.5 5 2.7 9.1 1.5 12c1.2 2.9 5 7 10.5 7s9.3-4.1 10.5-7C21.3 9.1 17.5 5 12 5zm0 11.2a4.2 4.2 0 1 1 0-8.4 4.2 4.2 0 0 1 0 8.4zm0-2.3a1.9 1.9 0 1 0 0-3.8 1.9 1.9 0 0 0 0 3.8z"/></svg></span><div><b>已退出上帝视角</b><p>你现在可以继续正常观战。</p></div></div>
      <button class="outline wide" id="godExitOk">知道了</button>
    </div>
  </div>

  <!-- 设置 -->
  <div id="settingsPanel" class="modal hidden">
    <div class="sheet">
      <div class="sheet-head"><span class="mi-icon">⚙️</span><b class="title">设置</b></div>
      <div class="set-row"><span>牌面大小</span><div class="seg" data-set="cardSize"><button data-v="s">小</button><button data-v="m">中</button><button data-v="l">大</button></div></div>
      <div class="set-row"><span>桌面颜色</span><div class="seg" data-set="theme"><button data-v="blue">蓝</button><button data-v="green">绿</button><button data-v="purple">紫</button></div></div>
      <div class="set-row"><span>音效</span><div class="seg" data-set="sound"><button data-v="on">开</button><button data-v="off">关</button></div></div>
      <div class="set-row"><span>出牌二次确认</span><div class="seg" data-set="confirm"><button data-v="on">开</button><button data-v="off">关</button></div></div>
      <button class="cancel">完成</button>
    </div>
  </div>

  <!-- 结算 -->
  <div id="resultModal" class="modal hidden">
    <div class="sheet result">
      <div class="res-title" id="resTitle"></div>
      <div class="res-level" id="resLevel"></div>
      <div class="res-rank" id="resRank"></div>
      <div class="res-note" id="resNote"></div>
      <div class="res-btns" id="resBtns"></div>
    </div>
  </div>

  <!-- 存档 / 读档 -->
  <div id="savePanel" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><b id="panelTitle"></b><button id="closePanelBtn" class="small">关闭</button></div>
      <div id="saveResult" class="hidden">
        <p>已存档，对局已暂停。存档文件已下载，本浏览器也保留了一份。</p>
        <p class="muted">换设备或发给别人时，复制下面的存档码即可。下次在任意房间「读取存档」，坐满后点「继续对局」。</p>
        <textarea id="savedCode" readonly></textarea>
        <button id="copyCodeBtn" class="primary">复制存档码</button>
      </div>
      <div id="loadArea" class="hidden">
        <div id="localSaves"></div>
        <label class="file-btn">从文件读取<input type="file" id="saveFile" hidden></label>
        <textarea id="pasteCode" placeholder="或粘贴存档码（GD1. 开头）"></textarea>
        <button id="loadCodeBtn" class="primary">读取存档码</button>
      </div>
    </div>
  </div>

  <input type="file" id="avatarFile" accept="image/*" hidden>
  <div id="toast" class="hidden"></div>
  <div id="fx" class="fx hidden"><div class="fx-title"></div><div class="fx-sub"></div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
