# Render 一键部署：https://render.com → New → Blueprint → 选择本仓库
services:
  - type: web
    name: guandan-online
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 存档码加密密钥：自动生成并保持不变，重新部署后旧存档仍可读取
      - key: SAVE_SECRET
        generateValue: true
